<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/assets/recipe-book-bw.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A searchable recipe book with checklists for ingredients and steps."
    />
    <title>Sharmi's Cook Book</title>
    <script>
      // Sets the theme before the first paint, so a dark-theme visitor never sees a white flash.
      // Must match src/hooks/useTheme.js: the storage key, its values, and data-theme.
      (function () {
        var choice;
        try {
          choice = localStorage.getItem('recipes:theme');
        } catch (e) {
          // storage blocked: follow the system
        }
        var systemDark =
          window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var dark = choice === 'dark' || (choice !== 'light' && systemDark);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
