name: CI

on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:

# Least privilege by default; the deploy job adds what Pages needs.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Validate recipes
        run: npm run validate:recipes

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # CSS and native browser behavior that jsdom can't test (focus outlines, contrast,
      # the checkmark, Escape in the search box). Uses the runner's installed Chrome.
      - name: Install browser driver
        run: npm ci --prefix .claude/skills/run-recipes

      - name: Browser checks
        run: node .claude/skills/run-recipes/driver.mjs regression --fresh

      - name: Upload browser screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-check-screenshots
          path: .claude/skills/run-recipes/shots/

      - name: Upload artifact for GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # Never run two deploys at once, and let an in-progress deploy finish.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
